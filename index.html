<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <div class="flex items-center justify-center min-h-screen px-4 py-10">

        <div class="w-full max-w-md p-6 bg-white shadow-xl rounded-2xl sm:p-8">

            <div class="mb-6 text-center">
                <h1 class="text-3xl font-bold text-gray-800">
                    Create Account
                </h1>

                <p class="mt-2 text-sm text-gray-500">
                    Register now and create your account
                </p>
            </div>


            <form id="regForm" class="space-y-4">

                <!-- Name -->
                <div>
                    <label for="name" class="block mb-1 text-sm font-semibold text-gray-700">
                        Full Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter your full name" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">

                    <p id="nameError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Email -->
                <div>
                    <label for="email" class="block mb-1 text-sm font-semibold text-gray-700">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">

                    <p id="emailError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Gender -->
                <div>
                    <label class="block mb-2 text-sm font-semibold text-gray-700">
                        Gender
                    </label>

                    <div class="flex gap-5">

                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                class="accent-blue-500"
                            >
                            <span class="text-sm text-gray-600">
                                Male
                            </span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                                class="accent-blue-500"
                            >
                            <span class="text-sm text-gray-600">
                                Female
                            </span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                                class="accent-blue-500"
                            >
                            <span class="text-sm text-gray-600">
                                Other
                            </span>
                        </label>

                    </div>

                    <p id="genderError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Phone -->
                <div>
                    <label for="phone" class="block mb-1 text-sm font-semibold text-gray-700">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">

                    <p id="phoneError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Password -->
                <div>
                    <label for="password" class="block mb-1 text-sm font-semibold text-gray-700">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">

                    <p id="passwordError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block mb-1 text-sm font-semibold text-gray-700">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">

                    <p id="confirmPasswordError" class="hidden mt-1 text-xs text-red-500">
                    </p>
                </div>


                <!-- Terms -->
                <div class="flex items-start gap-2 text-sm">

                    <input type="checkbox" id="terms" class="mt-1 accent-blue-500">

                    <label for="terms" class="text-gray-600">
                        I agree to the
                        <span class="text-blue-500 cursor-pointer">
                            Terms & Conditions
                        </span>
                    </label>

                </div>

                <p id="termsError" class="hidden text-xs text-red-500">
                    Please accept the terms and conditions
                </p>


                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg cursor-pointer">
                    Create Account
                </button>

            </form>


            <!-- Success Message -->
            <div id="successMessage" class="hidden p-3 mt-5 text-sm text-center text-green-700 bg-green-100 border border-green-300 rounded-lg">
                Registration successful! 🎉
            </div>


            <!-- Login Link -->
            <p class="mt-6 text-sm text-center text-gray-500">
                Already have an account?

                <a href="#" class="font-semibold text-blue-500 hover:underline">
                    Login
                </a>
            </p>

        </div>
    </div>


    <scrip src="script.js">
        </script>


</body>

</html>
